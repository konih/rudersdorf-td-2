[project]
name = "rudersdorf-td-2"
version = "2.0.0.dev0"
description = "Rudersdorf 2 · Das Labyrinth — ein Tower-Defense-Lernspiel in Python"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygame-ce>=2.5.6"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".specify", ".claude", "specs"]

[tool.ruff.lint]
# Verständliche Anfänger-Lösungen dürfen bewusst mehrere if-Stufen verwenden.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# In der Werkstatt sind Werkzeuge für die Missionen schon importiert.
"werkstatt/*.py" = ["F401"]
