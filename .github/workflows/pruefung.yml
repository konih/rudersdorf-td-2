name: Rudersdorf 2 prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pruefen:
    name: Referenz · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: make check
